name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Verify the root source mirror is in sync
        run: |
          # The project is carried twice: app/ is what Gradle builds, src/ mirrors
          # it for the on-device CodeAssist build. A drifted mirror ships old code.
          if ! diff -rq app/src/main src/main; then
            echo "ERROR: src/ is out of sync with app/src/main — copy it and commit."
            exit 1
          fi

      - name: Run the unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
