name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.3"

      - name: Compute version from tag
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"; V="${V#.}"
            echo "VERSION_NAME=$V" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=1.0.$(date +%Y%m%d%H%M)" >> "$GITHUB_ENV"
          fi
          echo "VERSION_CODE=$(( $(date +%s) / 60 ))" >> "$GITHUB_ENV"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/agent-trader.keystore
          else
            echo "No keystore secret set — release APK will be unsigned."
          fi

      - name: Verify the root source mirror is in sync
        run: |
          # The project is carried twice (app/ for Gradle, src/ for CodeAssist).
          # A drifted mirror silently ships old code to the on-device build.
          if ! diff -rq app/src/main src/main; then
            echo "ERROR: src/ is out of sync with app/src/main — copy it and commit."
            exit 1
          fi
          if ! diff -rq app/src/test src/test; then
            echo "ERROR: src/test is out of sync with app/src/test — copy it and commit."
            exit 1
          fi

      - name: Test and build debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Build release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Agent-Trader-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/Agent-Trader-release.apk
          else
            echo "WARNING: no signed release APK produced"
            ls app/build/outputs/apk/release/ || true
          fi
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
          ls -la

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.0.$(date +%Y%m%d%H%M)"
            TAG="v$VERSION"
          fi
          {
            echo "## Agent Trader v$VERSION"
            echo
            echo "### Install — pick the file that matches the app you already have"
            echo "Both APKs are valid, but they are signed with **different keys**."
            echo "Android only lets an update install over an app with the SAME key, so:"
            echo "- **Agent-Trader-debug.apk** — key \`CN=Android Debug\` (SHA256 A9:E3:FE:09…)"
            echo "- **Agent-Trader-release.apk** — key \`CN=Agent Trader\` (SHA256 98:AD:AD:A7…)"
            echo "- In the app, type \`/cert\` — it prints the key of the build you run, and therefore the file to download."
            echo "- If the installer says \"App not installed\" / INSTALL_FAILED_UPDATE_INCOMPATIBLE, you picked the other file. The failed install does not touch your data — just try the other one."
            echo "- Verify: \`sha256sum -c SHA256SUMS.txt\`"
            echo
            echo "### Highlights"
            echo "- The position size is the size you set: set risk <pct> is the share of the FREE balance (the exchange available field = balance minus the margin the open positions hold). PAPER and LIVE use the same rule, the paper book reserves the margin like the exchange does, and nothing shrinks the size behind your back"
            echo "- The leverage is the exchange's, not the app's: each symbol's tiered risk limit table (read live from \`get_position_tiers\`) sets both the maximum leverage per tier and the maintenance margin rate. The tier of a position is calculated from the leverage you select, and the entry is refused if your position value would exceed that tier's cap — fail-closed, nothing invented by the app"
            echo "- The stop is yours: \`set sl <pct>\` attaches a stop that % from entry, 0 attaches none (a plain market order). The take-profit ladder is sized on that distance. The liquidation price uses the documented Bitunix formula with the tier's own MMR"
            echo "- The app picks the trading universe itself: every scan refreshes it to the top symbols by 24h gainers or volume, filtered by minimum 24h volume"
            echo "- Commands read plain sentences (\"min volume 24h usd 10000\"), and \`set universe\` checks the symbols against Bitunix"
            echo "- \`/cert\` shows the signing key, \`/backup\` / \`/restore\` save and restore every setting"
            echo "- Bitunix futures engine: signed REST (marginCoin, per-endpoint rate limits, retry), WS on wss://fapi.bitunix.com/public + /private, live order path with TP/SL"
            echo "- Agentic chat: multi-turn LLM memory, wired slash commands, provider tester"
            echo "- LIVE balance always comes from the exchange (never the paper account)"
            echo "- The live position context comes from the exchange too: the chat and the screens read the REST position list and reconcile it on every snapshot, so the app never describes a position it has not seen — and \`positions history\` is labelled CLOSED"
            echo "- The \"N strategies agree\" gate counts independent market views, not names: three copies of one signal can no longer open it, and the strategies that used to vote the wrong side now abstain instead of guessing"
            echo "- DNS/network outages are reported as connectivity issues, not model failures"
            echo "- Dark trading theme with chat bubbles and quick actions"
          } > release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "Agent Trader v$VERSION" --notes-file release-notes.md
          fi
