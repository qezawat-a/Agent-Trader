name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.3"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/agent-trader.keystore
          else
            echo "No keystore secret set — release APK will be unsigned."
          fi

      - name: Test and build debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Build release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Agent-Trader-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/Agent-Trader-release.apk
          else
            echo "WARNING: no signed release APK produced"
            ls app/build/outputs/apk/release/ || true
          fi
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
          ls -la

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.0.$(date +%Y%m%d%H%M)"
            TAG="v$VERSION"
          fi
          {
            echo "## Agent Trader v$VERSION"
            echo
            echo "### Install"
            echo "- **Agent-Trader-debug.apk** — installable debug build (recommended)"
            echo "- **Agent-Trader-release.apk** — signed release build (when signing is configured)"
            echo "- Verify: \`sha256sum -c SHA256SUMS.txt\`"
            echo
            echo "### Highlights"
            echo "- Bitunix futures engine: signed REST (marginCoin, retry/throttle), WS on wss://fstream.bitunix.com/ws, live order path with TP/SL"
            echo "- Agentic chat: multi-turn LLM memory, wired slash commands, provider tester"
            echo "- Dark trading theme with chat bubbles and quick actions"
          } > release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "Agent Trader v$VERSION" --notes-file release-notes.md
          fi
